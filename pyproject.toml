[build-system]
requires = [
    "wheel",
    "numpy>=2.0.0,<3.0",
    "setuptools>=42",
    "versioneer[toml]",
    "Cython>=3.1.0"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
# There is no [project] table, so ruff cannot infer this from the metadata.
target-version = "py311"
# Vendored and generated respectively; versioneer rewrites version.py on release.
extend-exclude = ["versioneer.py", "trollimage/version.py"]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
# T10 (flake8-debugger) preserves a property the old flake8-debugger plugin gave us.
# Q (flake8-quotes) is deliberately absent: quote style is owned by ruff format.
select = [
    "A", "B", "C4", "C90", "D", "DTZ", "E", "F", "FURB", "I", "ISC", "NPY",
    "PERF", "PIE", "PLE", "PT", "RUF", "S", "SIM", "T10", "T20", "TID",
    "UP", "W",
]
# Deferred so this change stays reviewable; each is its own follow-up pass.
ignore = [
    "UP031",   # %-format -> f-string, ~95 sites
    "RUF005",  # [*a, b] over a + [b], a readability preference, ~22 sites
]
# Deliberately not selected. Revisit these one family at a time:
#   ANN  (~950)  the package ships py.typed but is essentially unannotated
#   N    (26)    N806 flags domain-correct color-channel names (R/G/B/X/Y/Z), and
#                N818 would rename the public UnknownImageFormat exception
#   PTH  (~76)   os.path -> pathlib
#   EM, TRY, ERA, FBT, COM, G  (~226 combined) opinionated, no Pytroll consensus

[tool.ruff.lint.per-file-ignores]
# Sphinx requires the module-level name `copyright`.
"doc/conf.py" = ["A001"]
# Scripts and examples print to stdout on purpose.
"doc/examples/utilities-examples.py" = ["T201", "D100"]
"load_colorbrewer_colormaps.py" = ["T201"]
"setup.py" = ["T201"]
# S101: `assert` is how tests assert.
"trollimage/tests/*" = ["S101"]
# unittest.TestCase-era file. Every one of these is addressed by
# specs/test-suite-cleanup.md; deleting this entry is that spec's closing move.
"trollimage/tests/test_image.py" = ["PT009", "PT027", "S311", "NPY002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# A ratchet, not a target: the current worst offender is XRImage.rio_save at 19.
# Drop this to 10 as the closing move of specs/xrimage-save-finalize-refactor.md,
# which also covers image.py __init__ (18), stretch (15) and convert (11).
max-complexity = 20

[tool.coverage.run]
relative_files = true
plugins = ["Cython.Coverage"]
omit = ["trollimage/version.py", "versioneer.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    # remove when fixed by xarray
    "ignore:__array_wrap__ must accept context and return_scalar arguments:DeprecationWarning:numpy",
    # dateutil needs a new release
    # https://github.com/dateutil/dateutil/issues/1314
    'ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated and scheduled for removal:DeprecationWarning:dateutil',
    # updates incoming in pillow that remove this warning for our use cases
    # https://github.com/python-pillow/Pillow/pull/9063
    "ignore:'mode' parameter is deprecated",
    # dask deprecated the map_blocks token= kwarg but it is being reverted
    "ignore:The `token=` keyword to `map_blocks` has been moved to:FutureWarning",
    # rasterio composes affine transforms with `*` (ex. rasterio.transform.from_bounds, used by
    # trollimage when writing geotiffs); affine 3.1 made that a PendingDeprecationWarning.
    # Remove once rasterio switches to the `@` matmul operator.
    "ignore:Use `@` matmul instead of:PendingDeprecationWarning:rasterio",
]
log_cli_level = "info"
testpaths = [
    "trollimage/tests",
]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "trollimage/version.py"
versionfile_build = "trollimage/version.py"
tag_prefix = "v"
